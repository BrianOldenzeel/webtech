{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="flex items-center justify-center min-h-[80vh]">

  <div class="w-full max-w-md">
    <div class="bg-white shadow-lg rounded-2xl p-8">

      <h2 class="text-2xl font-bold text-center mb-6">Register</h2> 

      <form method="POST" action="/register">

        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Voornaam</label>
          <input
            type="text"
            name="voornaam"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          />
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Achternaam</label>
          <input
            type="text"
            name="achternaam"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          />
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Email</label>
          <input
            type="email"
            name="email"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          />
        </div>

        <div class="mb-4">
          <label class="block text-gray-700 mb-2">Studie</label>
          <select
            name="studie"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          >
            <option value="" disabled selected>Kies je studie</option>
            <option value="HBO-ICT">HBO-ICT</option>
            <option value="Geneeskunde">Geneeskunde</option>
            <option value="Economie">Economie</option>
          </select>
        </div>

        <div class="mb-6">
          <label class="block text-gray-700 mb-2">Password</label>
          <input
            type="password"
            name="password"
            required
            class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition"
        >
          Register
        </button>

      </form>

    </div>
  </div>

</div>

{% endblock %}
